resolved:
  - "FIXED: 2>&1 fd redirects were matching WRITE_BASH_PATTERNS — added negative lookahead (?!&\\d) to the redirection regex: />>?(?!&\\d)\\s*\\S/. Real file redirects (> file, >> file, 2>file, &>file) still caught; fd-to-fd redirects (2>&1, 1>&2) now pass through as read-only."
  - "RESOLVED: Specs location confirmed as .agentic/specs/ — used by library-developer for read access to project specifications"
  - "RESOLVED: Library code lives in packages/library/ — the library-developer agent has full read/write/delete access there"
  - "RESOLVED: Bash timeout configurable via env vars — BASH_DEFAULT_TIMEOUT_MS (default 2 min) and BASH_MAX_TIMEOUT_MS (default 10 min, the ceiling). Can be set via the `env` key in settings.json to apply to all sessions, or in shell profile before Claude Code starts. Project currently uses BASH_DEFAULT_TIMEOUT_MS=600000 (10 min) and BASH_MAX_TIMEOUT_MS=1800000 (30 min)."
  - "FIXED: Expertise injection for subagents — expertise.hook.ts now handles SessionStart event (primary injection point). Uses flag-based de-duplication: SessionStart writes flag + injects; UserPromptSubmit checks flag and skips if already injected. This ensures expertise is available from session start in both interactive and -p modes."
  - "FIXED: Stop hook not reliably firing for subagents — all expertise hooks (SessionStart, UserPromptSubmit, Stop) moved from settings.json to agent frontmatter. hire-expert template updated so new agents get hooks automatically."
  - "FIXED: library-validator agent Stop hook had typo in command path — expertence.hook.ts (missing 'i') → expertise.hook.ts. This caused the Stop hook to fail silently (bun couldn't find the file), so the agent never received expertise update reminders."
  - "REMOVED: Session/logging infrastructure from old delegate skill — no more _conversation.jsonl, agent_logs, CRYPLATIVE_SESSION_ID, or reference.md."
  - "REMOVED: Direct delegation via delegate skill — replaced by agentrack-based task assignment. Managers create issues and assign them; the agent runner picks up issues and launches agents. Project-wide hooks enforce token usage and issue cleanup."
  - "FIXED: agentrack SKILL.md CLI syntax was out of sync with actual CLI — missing init command, missing users section, missing --path option on create, blockages --by variadic syntax unclear, and workflow guidelines had 3 overlapping contradictory versions. Verified all commands against `--help` output and rewrote to match. Also added explicit note that `create` takes title as positional arg (not --title flag) since agents were hitting errors using --title."
  - "FIXED: Multi-phase flow failure — /issue skill only created review tasks, then stopped. CTO never re-engaged because (a) parent was assigned to user not cto, (b) auto-promotion marked parent done when reviews completed. Fix: /issue skill now creates ALL tasks upfront (reviews + implementation + quality) with blockages, assigns parent to cto. Consolidated worktask/agentrack-manager/agentrack-subordinate into agentrack-implement + issue."
  - "FIXED: Broken skill references — agents referenced deleted skills (agentrack-manager, agentrack-subordinate, worktask) silently. Cleaned up all agents to use agentrack-implement (all) + issue (CTO only). Deleted worktask skill directory."
  - "FIXED: enforce-agentrack-token.ts hook file was named enforce-agentack-token.ts (missing 'r' in 'agentrack') — settings.json referenced the correct name but the file didn't match. This caused a 'Module not found' error on every agent's agt call, so all issues were created by the anonymous user. Renamed file to enforce-agentrack-token.ts to match settings.json reference."
  - "FIXED: Parallel PreToolUse hooks clobbering updatedInput — enforce-agent-access.ts returned JSON allow (no updatedInput), which overwrote enforce-agentrack-token.ts's updatedInput (with injected AGT_USER_TOKEN). Result: agt commands ran without token, defaulted to 'javi' author. Fix: access hook now exits 0 silently for allow (no JSON output), only outputs JSON for deny. This prevents it from interfering with other hooks' updatedInput."
