      - "Phase 2: Implement new helpers"
      - "Phase 3: Rewrite Type A tests (init, push, pull)"
      - "Phase 4: Rewrite Type B tests (all other commands)"
      - "Phase 5: Remove old helpers"
    key_pattern: "When splitting E2E tests by infrastructure dependency, separate git-operation tests (init/push/pull) from data-operation tests (CRUD). Git tests need full environment teardown; data tests only need file-level resets."
